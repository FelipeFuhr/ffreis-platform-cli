repos:
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.16.3
  hooks:
  - id: gitleaks
# golangci-lint runs via the lefthook `lint` step (built from source with the
# repo's Go toolchain). The pre-commit prebuilt binary is built with an older Go
# and refuses this repo's newer go target, so it is intentionally not duplicated here.
- repo: https://github.com/jumanjihouse/pre-commit-hooks
  rev: 3.0.0
  hooks:
  - id: shellcheck
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.4.0
  hooks:
  - id: end-of-file-fixer
  - id: trailing-whitespace
