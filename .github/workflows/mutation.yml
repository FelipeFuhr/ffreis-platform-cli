name: Mutation Testing

on:
  schedule:
    - cron: "20 3 21 * *"  # monthly scattered (was: 0 2 * * 0)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-mutation.yml@2253ff2eda0a3d65f9eaca1a3ae117d32a449e20 # v1.2.0
    with:
      packages: "./pkg/..."
      threshold: 60
