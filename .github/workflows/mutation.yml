name: Mutation Testing

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "20 3 21 * *"  # monthly scattered (was: 0 2 * * 0)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-mutation.yml@4c3fd318bc57a8f17be0d49047fb869040378a87 # v1.8.0
    with:
      runner: '["ubuntu-latest"]'
      packages: "./pkg/..."
      threshold: 60
  mutation-incremental:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-mutation.yml@4c3fd318bc57a8f17be0d49047fb869040378a87 # v1.8.0
    with:
      in-diff: true
      runner: '["ubuntu-latest"]'
      threshold: 60
