name: Mutation Testing

on:
  schedule:
    - cron: "20 3 21 * *"  # monthly scattered (was: 0 2 * * 0)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-mutation.yml@c3d274cf44074f49908948305861c74714cdc9d9 # v1.3.0
    with:
      packages: "./pkg/..."
      threshold: 60
