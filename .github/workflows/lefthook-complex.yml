name: Lefthook Complex

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Heavy lefthook tier to run on the whole tree"
        type: choice
        options: [complex, release]
        default: complex

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lefthook-complex:
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-lefthook-complex.yml@82097e621b8f630f2be2f759025529f7f5442796 # v1.9.0
    with:
      working-directory: "."
      tier: ${{ inputs.tier }}
      setup-go: true
      install-golangci-lint: false
      install-govulncheck: true
      lefthook-bootstrap-command: "make lefthook-bootstrap"
      lefthook-bin: ".bin/lefthook"
