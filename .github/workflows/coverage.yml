name: Code Coverage (Codecov)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**"
      - ".github/workflows/**"
  push:
    branches: [main, master]
    paths:
      - "**"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-coverage.yml@2253ff2eda0a3d65f9eaca1a3ae117d32a449e20 # v1.2.0
    with:
      go-version: "1.25.9"
      working-directory: "."
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
